name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-test-build:
    name: Backend Lint, Test and Docker Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finapp
          POSTGRES_USER: finapp
          POSTGRES_PASSWORD: finapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://finapp:finapp@localhost:5432/finapp
      SETUP_TOKEN: test-setup-token
      JWT_SECRET: test-jwt-secret-with-at-least-256-bits-length-secure-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run Ruff Linter
        run: |
          uv run ruff check .

      - name: Run Ruff Formatter check
        run: |
          uv run ruff format --check .

      - name: Run Mypy Type Checker
        run: |
          uv run mypy app tests

      - name: Run Alembic Migrations
        run: |
          uv run alembic upgrade head

      - name: Run Pytest
        run: |
          uv run pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Validation)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: finnapp-api:ci-test
